<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="AskSE — University Software Engineering Help Desk Assistant" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#F6F7FB" />
    <title>AskSE — Department Help Desk</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('askse_theme');
          var theme = stored;
          if (!theme || (theme !== 'light' && theme !== 'dark')) {
            theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#070A14' : '#F6F7FB');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-theme-bg text-theme-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
